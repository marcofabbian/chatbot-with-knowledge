name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test-scan-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Clean build directories
        run: ./gradlew clean --no-daemon

      - name: Build project and run unit tests
        run: ./gradlew build --no-daemon

      - name: Define image metadata
        id: image
        run: |
          echo "name=marcofabbian/chatbot" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: docker build --tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" .

      - name: Scan image with Grype
        id: scan
        uses: anchore/scan-action@v6
        with:
          image: "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          fail-build: false
          severity-cutoff: high
          output-format: json

      - name: Display High and Critical vulnerabilities
        run: |
          echo
          echo "=============================================================="
          echo "        HIGH AND CRITICAL VULNERABILITIES"
          echo "=============================================================="

          jq -r '
            .matches[]
            | select(
                .vulnerability.severity == "Critical" or
                .vulnerability.severity == "High"
              )
            | [
                .artifact.name,
                .artifact.version,
                .vulnerability.id,
                .vulnerability.severity,
                (.vulnerability.fix.versions // [] | join(", "))
              ]
            | @json
          ' "${{ steps.scan.outputs.json }}" |
          while read -r line; do
            jq -r -j '
              .[0], "\t",
              .[1], "\t",
              .[2], "\t",
              .[3], "\t",
              .[4], "\n"
            ' <<< "$line"
          done |
          awk -F '\t' '
            BEGIN {
              printf "%-30s %-18s %-20s %-10s %s\n",
                    "PACKAGE", "VERSION", "VULNERABILITY", "SEVERITY", "FIXED IN"
              printf "%-30s %-18s %-20s %-10s %s\n",
                    "------------------------------",
                    "------------------",
                    "--------------------",
                    "----------",
                    "--------------------"
            }
            {
              printf "%-30s %-18s %-20s %-10s %s\n",
                    $1, $2, $3, $4, $5
            }
          '

          echo
          echo "=============================================================="

      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:latest"
