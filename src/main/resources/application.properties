server.port=8080
spring.application.name=chatbot-with-knowledge
# Use the default profile unless SPRING_PROFILES_ACTIVE is set (for example, to prod).
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
logging.level.root=INFO
logging.level.com.marcofabbian.chatbot=INFO

# Real AI provider settings (chatbot.*)
chatbot.openai.api-key=${OPENAI_API_KEY:}
chatbot.openai.base-url=https://api.openai.com
chatbot.openai.model=gpt-5.4
chatbot.openai.max-output-tokens=500
chatbot.openai.connect-timeout=5s
chatbot.openai.read-timeout=30s
chatbot.max-question-length=1000
chatbot.rate-limit.requests-per-minute=10

# Fetch the Gutenberg book once at startup; disabled or unavailable knowledge blocks chat.
chatbot.knowledge.enabled=true
# Project Gutenberg HTML source and citation label.
chatbot.knowledge.source-url=https://www.gutenberg.org/cache/epub/34463/pg34463-images.html
chatbot.knowledge.source-name=How to Invest Money
# Connect and read timeout for the source fetch.
chatbot.knowledge.fetch-timeout=10s
# Page-aware chunk size and overlap, in characters.
chatbot.knowledge.chunk-size-chars=800
chatbot.knowledge.chunk-overlap-chars=150
# Maximum selected passages and total passage characters.
chatbot.knowledge.top-k=4
chatbot.knowledge.max-context-chars=4000

# Actuator: expose only health (and info); details hidden from callers
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never